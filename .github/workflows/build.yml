name: Build & Release MHS Download Manager

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/refresh GitHub Release for current manifest version"
        required: false
        default: false
        type: boolean

concurrency:
  group: mhs-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  build-windows-x64-installer:
    name: Build, Verify & Release Windows x64 Setup
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Browser Extension Manifest & JS Syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ManifestPath = Join-Path $PWD "extension\manifest.json"
          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw | ConvertFrom-Json
          if ($Manifest.manifest_version -ne 3) {
            throw "Expected Manifest V3 in extension/manifest.json, got $($Manifest.manifest_version)"
          }
          if ([string]::IsNullOrWhiteSpace($Manifest.version)) {
            throw "Missing version in extension/manifest.json"
          }
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $ExpectedTagVer = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($Manifest.version -ne $ExpectedTagVer) {
              throw "Tag version ($ExpectedTagVer) does not match extension/manifest.json version ($($Manifest.version))"
            }
          }
          Get-ChildItem -Path (Join-Path $PWD "extension") -Filter "*.js" | ForEach-Object {
            Write-Host "Checking syntax: $($_.Name)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed for $($_.FullName)"
            }
          }

      - name: Compile mdm.exe & Setup Installer via build.ps1
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Smoke-Test Setup Installer & Verify Installed extension\ Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SetupExe = Get-ChildItem -Path (Join-Path $PWD "bin") -Filter "MHS-Download-Manager-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $SetupExe) {
            throw "Compiled Setup .exe was not found in bin\"
          }

          $VerifyInstallDir = Join-Path $env:RUNNER_TEMP "mhs_setup_smoke_verify"
          if (Test-Path -LiteralPath $VerifyInstallDir) {
            Remove-Item -LiteralPath $VerifyInstallDir -Recurse -Force
          }

          Write-Host "Running silent Setup smoke test into: $VerifyInstallDir"
          $Proc = Start-Process -FilePath $SetupExe.FullName -ArgumentList @(
            "--shihab-silent",
            "--shihab-no-registry",
            "--shihab-install-dir",
            $VerifyInstallDir
          ) -Wait -PassThru

          if ($Proc.ExitCode -ne 0) {
            throw "Silent Setup smoke test failed with exit code $($Proc.ExitCode)"
          }

          $RequiredInstalledFiles = @(
            "mdm.exe",
            "Uninstall.exe",
            "README.md",
            "LICENSE",
            "extension\manifest.json",
            "extension\mehedi_content.js",
            "extension\mehedi_page_hook.js",
            "extension\shihab_background.js",
            "extension\shihab_popup.html",
            "extension\shihab_popup.css",
            "extension\mehedi_popup.js",
            "extension\images\shihab_logo128.png",
            "extension\images\author_shihab.jpg"
          )

          foreach ($RelFile in $RequiredInstalledFiles) {
            $FullCheckPath = Join-Path $VerifyInstallDir $RelFile
            if (-not (Test-Path -LiteralPath $FullCheckPath)) {
              throw "Setup .exe failed to install required file in installation directory: $RelFile"
            }
          }

          Write-Host "Verified all $($RequiredInstalledFiles.Count) installed app & unpacked extension files in $VerifyInstallDir\extension"
          Remove-Item -LiteralPath $VerifyInstallDir -Recurse -Force

      - name: Stage Official Release Assets & SHA-256 Manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath "release-dist") {
            Remove-Item -LiteralPath "release-dist" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null

          $Manifest = Get-Content -LiteralPath (Join-Path $PWD "extension\manifest.json") -Raw | ConvertFrom-Json
          $VerClean = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $Manifest.version }
          $TagVer = "v$VerClean"

          $SetupExeName = "MHS-Download-Manager-Setup-$VerClean-x64.exe"
          $PortableExeName = "MHS-Download-Manager-Portable-$VerClean-x64.exe"
          $ExtArchiveName = "MHS-Browser-Extension-$VerClean.zip"

          $BuiltSetup = Join-Path $PWD "bin\MHS-Download-Manager-Setup-$VerClean-x64.exe"
          if (-not (Test-Path -LiteralPath $BuiltSetup)) {
            $BuiltSetup = (Get-ChildItem -Path (Join-Path $PWD "bin") -Filter "MHS-Download-Manager-Setup-*-x64.exe" | Select-Object -First 1).FullName
          }
          $BuiltPortable = Join-Path $PWD "bin\mdm.exe"
          if (-not (Test-Path -LiteralPath $BuiltPortable)) {
            throw "Compiled portable binary bin\mdm.exe was not found"
          }

          $StagedSetupExe = Join-Path $PWD "release-dist\$SetupExeName"
          $StagedPortableExe = Join-Path $PWD "release-dist\$PortableExeName"
          $StagedExtZip = Join-Path $PWD "release-dist\$ExtArchiveName"

          Copy-Item -LiteralPath $BuiltSetup -Destination $StagedSetupExe -Force
          Copy-Item -LiteralPath $BuiltPortable -Destination $StagedPortableExe -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path -LiteralPath $StagedExtZip) {
            Remove-Item -LiteralPath $StagedExtZip -Force
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD "extension"),
            $StagedExtZip,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          # Guarantee strictly ONE Setup .exe exists in release-dist
          $SetupFilesCount = @(Get-ChildItem -Path (Join-Path $PWD "release-dist") -Filter "*Setup*.exe").Count
          if ($SetupFilesCount -ne 1) {
            throw "Expected strictly 1 Setup .exe in release-dist, found $SetupFilesCount"
          }

          $SetupSha = (Get-FileHash -LiteralPath $StagedSetupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $PortableSha = (Get-FileHash -LiteralPath $StagedPortableExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $ExtZipSha = (Get-FileHash -LiteralPath $StagedExtZip -Algorithm SHA256).Hash.ToLowerInvariant()

          $ShaLines = @(
            "$SetupSha  $SetupExeName",
            "$PortableSha  $PortableExeName",
            "$ExtZipSha  $ExtArchiveName"
          )
          Set-Content -Path (Join-Path $PWD "release-dist\SHA256SUMS.txt") -Value ($ShaLines -join "`n") -Encoding UTF8

          $NotesLines = @(
            "## MHS Download Manager $TagVer — Official Windows x64 Release (Mehedi Hasan Shihab)",
            "",
            "### Release Downloads",
            "- **``$SetupExeName``** *(Recommended)* — Official Windows x64 Setup Installer. Installs ``mdm.exe``, ``Uninstall.exe``, shortcuts, Native Messaging host, and keeps the ready-to-load **``extension\``** folder directly inside your installation directory (``<InstallDir>\extension``).",
            "- **``$PortableExeName``** — Standalone Portable Windows x64 Executable (``mdm.exe``). Run directly from any folder with zero installation.",
            "- **``$ExtArchiveName``** — Standalone Unpacked Browser Extension ZIP (for Portable users; Setup Installer users already get ``<InstallDir>\extension`` automatically).",
            "- **``SHA256SUMS.txt``** — Official SHA-256 verification checksums.",
            "",
            "### How to Install & Load the Browser Extension from Your Installation Directory",
            "1. Download and run **``$SetupExeName``** (default install folder: ``%LOCALAPPDATA%\Programs\MHS Download Manager``).",
            "2. On the final screen of Setup, the path ``<InstallDir>\extension`` is copied to your clipboard automatically (you can also click **Copy Path** / **Open Folder**, or open it anytime inside the app via **`☰` Menu -> Help -> Open Browser Extension Folder**).",
            "3. Open ``chrome://extensions`` (Chrome), ``brave://extensions`` (Brave), ``edge://extensions`` (Edge), or ``opera://extensions`` (Opera).",
            "4. Enable **Developer mode** (top-right toggle).",
            "5. Click **Load unpacked** and select the **``extension``** folder inside your installation directory:",
            "   ``%LOCALAPPDATA%\Programs\MHS Download Manager\extension`` *(or ``<YourInstallDir>\extension``)*.",
            "",
            "### What's New in $TagVer",
            "- **Dark Transfers Dashboard UI**: Redesigned main window with the ``TRANSFERS`` filter sidebar, live ``Local Storage`` & speed-limit card, rounded pill action bar + instant ``Filter transfers...`` search, 8-column progress grid, and 4-pill live socket/speed footer.",
            "- **Outside-Corner ``Download Video`` Pill & ``MHS STREAM SNIFFER`` Dropdown**: Floating translucent stadium pill positioned outside the top-right corner of ``<video>`` (never overlapping video playback) with quality selector rows (``MAX``, ``1080p``, ``720p``, ``480p``, ``AUDIO``, and sniffed streams).",
            "- **Updated About Developer Dialog & Extension Popup**: Circular author portrait and updated Dodger Blue theme accents.",
            "- **Single-Setup + Portable Release Packaging**: Publishes one clean Setup ``.exe`` (bundling ``<InstallDir>\extension``), one standalone Portable ``.exe``, the unpacked Extension ``.zip``, and ``SHA256SUMS.txt``.",
            "- **Strict User-Gesture Download Guard & 32-Segment Engine**: Zero unsolicited startup popups in Brave/Chrome/Edge, parallel HTTP ``206`` range acceleration, YouTube HD/4K resolver, and built-in lossless ``MP4`` / ``WebM`` / ``MKV`` muxer.",
            "",
            "### SHA-256 Checksums",
            "| Release File | Purpose | SHA-256 |",
            "| :--- | :--- | :--- |",
            "| ``$SetupExeName`` | Windows x64 Setup Installer (includes ``mdm.exe`` + ``<InstallDir>\extension``) | ``$SetupSha`` |",
            "| ``$PortableExeName`` | Standalone Portable x64 Executable (zero-install ``mdm.exe``) | ``$PortableSha`` |",
            "| ``$ExtArchiveName`` | Unpacked Browser Extension Archive (Chrome / Brave / Edge / Opera) | ``$ExtZipSha`` |"
          )
          Set-Content -Path (Join-Path $PWD "release-dist\RELEASE_NOTES.md") -Value ($NotesLines -join "`r`n") -Encoding UTF8
          Write-Output "TAG_VER=$TagVer" >> $env:GITHUB_ENV

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MHS-Download-Manager-${{ github.ref_name }}-Windows-x64
          path: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/MHS-Download-Manager-Portable-*-x64.exe
            release-dist/MHS-Browser-Extension-*.zip
            release-dist/SHA256SUMS.txt
            release-dist/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Clean Duplicate Setup Assets & Previous Tag Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($OldTag in @("v1.0.1", "v1.0.2")) {
            gh release delete-asset $OldTag "MHS-Download-Manager-Setup-x64.exe" --yes *> $null
            $global:LASTEXITCODE = 0
          }
          gh release view "$env:TAG_VER" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "$env:TAG_VER" --yes
          }
          $global:LASTEXITCODE = 0

      - name: Publish Latest GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VER }}
          name: "MHS Download Manager ${{ env.TAG_VER }} (Mehedi Hasan Shihab)"
          body_path: release-dist/RELEASE_NOTES.md
          make_latest: "true"
          files: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/MHS-Download-Manager-Portable-*-x64.exe
            release-dist/MHS-Browser-Extension-*.zip
            release-dist/SHA256SUMS.txt
