name: Build & Release MHS Download Manager

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/refresh GitHub Release for current manifest version (main branch only)"
        required: false
        default: false
        type: boolean
      force_recreate_release:
        description: "Delete and recreate existing tag release (WARNING: resets SmartScreen SHA-256 prevalence)"
        required: false
        default: false
        type: boolean

concurrency:
  group: mhs-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  build-windows-x64-installer:
    name: Build & Verify Windows x64 Setup
    runs-on: windows-latest
    outputs:
      tag_ver: ${{ steps.stage.outputs.tag_ver }}
      ver_clean: ${{ steps.stage.outputs.ver_clean }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Browser Extension Manifest & JS Syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ManifestPath = Join-Path $PWD "extension\manifest.json"
          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw | ConvertFrom-Json
          if ($Manifest.manifest_version -ne 3) {
            throw "Expected Manifest V3 in extension/manifest.json, got $($Manifest.manifest_version)"
          }
          if ([string]::IsNullOrWhiteSpace($Manifest.version) -or ($Manifest.version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$')) {
            throw "Invalid SemVer version in extension/manifest.json: $($Manifest.version)"
          }
          $FirefoxManifestPath = Join-Path $PWD "extension\manifest.firefox.json"
          $FirefoxManifest = Get-Content -LiteralPath $FirefoxManifestPath -Raw | ConvertFrom-Json
          if ($FirefoxManifest.manifest_version -ne 3) {
            throw "Expected Manifest V3 in extension/manifest.firefox.json, got $($FirefoxManifest.manifest_version)"
          }
          if ($FirefoxManifest.version -ne $Manifest.version) {
            throw "Firefox manifest version ($($FirefoxManifest.version)) does not match Chrome manifest version ($($Manifest.version))"
          }
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $ExpectedTagVer = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($Manifest.version -ne $ExpectedTagVer) {
              throw "Tag version ($ExpectedTagVer) does not match extension/manifest.json version ($($Manifest.version))"
            }
          }
          Get-ChildItem -Path (Join-Path $PWD "extension") -Recurse -Filter "*.js" | ForEach-Object {
            Write-Host "Checking syntax: $($_.FullName)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed for $($_.FullName)"
            }
          }

      - name: Compile mdm.exe, Uninstall.exe & Setup Installer (with Optional Authenticode Signing)
        shell: pwsh
        env:
          SIGN_CERT_PFX_B64: ${{ secrets.MHS_CODESIGN_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.MHS_CODESIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.MHS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $TempPfx = ''
          try {
            $BuildArgs = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\build.ps1')
            if (-not [string]::IsNullOrWhiteSpace($env:SIGN_CERT_PFX_B64)) {
              $TempPfx = Join-Path $env:RUNNER_TEMP "mhs_codesign_$([Guid]::NewGuid().ToString('N')).pfx"
              [System.IO.File]::WriteAllBytes($TempPfx, [System.Convert]::FromBase64String($env:SIGN_CERT_PFX_B64.Trim()))
              $TsUrl = if (-not [string]::IsNullOrWhiteSpace($env:SIGN_TIMESTAMP_URL)) { $env:SIGN_TIMESTAMP_URL.Trim() } else { 'http://timestamp.digicert.com' }
              $env:MHS_SIGN_PFX_PATH = $TempPfx
              $env:MHS_SIGN_PFX_PASSWORD = $env:SIGN_CERT_PASSWORD
              $BuildArgs += @('-TimestampUrl', $TsUrl)
              Write-Host "Authenticode signing enabled via repository secret (RFC 3161 timestamp: $TsUrl)."
            } else {
              Write-Host "No MHS_CODESIGN_PFX_BASE64 secret configured; building unsigned CI artifacts. See docs/CODE_SIGNING_AND_TRUST.md."
            }
            powershell @BuildArgs
            if ($LASTEXITCODE -ne 0) {
              throw "build.ps1 failed with exit code $LASTEXITCODE"
            }
          } finally {
            $env:MHS_SIGN_PFX_PATH = ''
            $env:MHS_SIGN_PFX_PASSWORD = ''
            if (-not [string]::IsNullOrWhiteSpace($TempPfx) -and (Test-Path -LiteralPath $TempPfx)) {
              Remove-Item -LiteralPath $TempPfx -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke-Test Setup Installer, CLI, PE Hygiene & Extension Layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SetupExe = Get-ChildItem -Path (Join-Path $PWD "bin") -Filter "MHS-Download-Manager-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $SetupExe) {
            throw "Compiled Setup .exe was not found in bin\"
          }

          $VerifyInstallDir = Join-Path $env:RUNNER_TEMP "mhs_setup_smoke_verify"
          if (Test-Path -LiteralPath $VerifyInstallDir) {
            Remove-Item -LiteralPath $VerifyInstallDir -Recurse -Force
          }

          Write-Host "Running silent Setup smoke test into: $VerifyInstallDir"
          $Proc = Start-Process -FilePath $SetupExe.FullName -ArgumentList @(
            "--shihab-silent",
            "--shihab-no-registry",
            "--shihab-install-dir",
            $VerifyInstallDir
          ) -Wait -PassThru

          if ($Proc.ExitCode -ne 0) {
            throw "Silent Setup smoke test failed with exit code $($Proc.ExitCode)"
          }

          $RequiredInstalledFiles = @(
            "mdm.exe",
            "Uninstall.exe",
            "README.md",
            "LICENSE",
            "extension\manifest.json",
            "extension\manifest.firefox.json",
            "extension\mehedi_content.js",
            "extension\mehedi_page_hook.js",
            "extension\shihab_background.js",
            "extension\shihab_popup.html",
            "extension\shihab_popup.css",
            "extension\mehedi_popup.js",
            "extension\shihab_captured.html",
            "extension\mehedi_captured.js",
            "extension\images\shihab_logo128.png",
            "extension\images\author_shihab.jpg"
          )

          foreach ($RelFile in $RequiredInstalledFiles) {
            $FullCheckPath = Join-Path $VerifyInstallDir $RelFile
            if (-not (Test-Path -LiteralPath $FullCheckPath)) {
              throw "Setup .exe failed to install required file in installation directory: $RelFile"
            }
          }

          # Ensure Uninstall.exe is the dedicated tiny payload-free binary (not a self-copy of Setup.exe)
          $UninstSize = (Get-Item -LiteralPath (Join-Path $VerifyInstallDir "Uninstall.exe")).Length
          if ($UninstSize -ge $SetupExe.Length) {
            throw "Expected dedicated payload-free Uninstall.exe ($UninstSize bytes < $($SetupExe.Length) bytes)"
          }

          $InstalledExe = Join-Path $VerifyInstallDir "mdm.exe"
          $CliOut = & $InstalledExe --cli status 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($CliOut)) {
            throw "Installed mdm.exe --cli status failed (exit=$LASTEXITCODE): $CliOut"
          }

          Write-Host "Verified $($RequiredInstalledFiles.Count) installed files, dedicated Uninstall.exe ($UninstSize bytes), and mdm.exe --cli status"

          $UninstProc = Start-Process -FilePath $SetupExe.FullName -ArgumentList @(
            "--shihab-uninstall",
            "--shihab-silent",
            "--shihab-no-registry",
            "--shihab-install-dir",
            $VerifyInstallDir
          ) -Wait -PassThru
          if ($UninstProc.ExitCode -ne 0) {
            throw "Silent uninstall smoke test failed with exit code $($UninstProc.ExitCode)"
          }
          if (Test-Path -LiteralPath $VerifyInstallDir) {
            Remove-Item -LiteralPath $VerifyInstallDir -Recurse -Force
          }

      - name: Stage Official Release Assets & SHA-256 Manifest
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath "release-dist") {
            Remove-Item -LiteralPath "release-dist" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null

          $Manifest = Get-Content -LiteralPath (Join-Path $PWD "extension\manifest.json") -Raw | ConvertFrom-Json
          $VerClean = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $Manifest.version }
          if ($VerClean -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid SemVer release version: $VerClean"
          }
          $TagVer = "v$VerClean"

          $SetupExeName = "MHS-Download-Manager-Setup-$VerClean-x64.exe"
          $PortableExeName = "MHS-Download-Manager-Portable-$VerClean-x64.exe"
          $ExtArchiveName = "MHS-Browser-Extension-$VerClean.zip"

          $BuiltSetup = Join-Path $PWD "bin\MHS-Download-Manager-Setup-$VerClean-x64.exe"
          if (-not (Test-Path -LiteralPath $BuiltSetup)) {
            $BuiltSetup = (Get-ChildItem -Path (Join-Path $PWD "bin") -Filter "MHS-Download-Manager-Setup-*-x64.exe" | Select-Object -First 1).FullName
          }
          $BuiltPortable = Join-Path $PWD "bin\mdm.exe"
          if (-not (Test-Path -LiteralPath $BuiltPortable)) {
            throw "Compiled portable binary bin\mdm.exe was not found"
          }

          $StagedSetupExe = Join-Path $PWD "release-dist\$SetupExeName"
          $StagedPortableExe = Join-Path $PWD "release-dist\$PortableExeName"
          $StagedExtZip = Join-Path $PWD "release-dist\$ExtArchiveName"

          Copy-Item -LiteralPath $BuiltSetup -Destination $StagedSetupExe -Force
          Copy-Item -LiteralPath $BuiltPortable -Destination $StagedPortableExe -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path -LiteralPath $StagedExtZip) {
            Remove-Item -LiteralPath $StagedExtZip -Force
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD "extension"),
            $StagedExtZip,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          # Guarantee strictly ONE Setup .exe exists in release-dist
          $SetupFilesCount = @(Get-ChildItem -Path (Join-Path $PWD "release-dist") -Filter "*Setup*.exe").Count
          if ($SetupFilesCount -ne 1) {
            throw "Expected strictly 1 Setup .exe in release-dist, found $SetupFilesCount"
          }

          $SetupSha = (Get-FileHash -LiteralPath $StagedSetupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $PortableSha = (Get-FileHash -LiteralPath $StagedPortableExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $ExtZipSha = (Get-FileHash -LiteralPath $StagedExtZip -Algorithm SHA256).Hash.ToLowerInvariant()

          $ShaLines = @(
            "$SetupSha  $SetupExeName",
            "$PortableSha  $PortableExeName",
            "$ExtZipSha  $ExtArchiveName"
          )
          Set-Content -Path (Join-Path $PWD "release-dist\SHA256SUMS.txt") -Value ($ShaLines -join "`n") -Encoding UTF8

          $NotesLines = @(
            "## MHS Download Manager $TagVer — Official Windows x64 Release (Mehedi Hasan Shihab)",
            "",
            "> **All Releases (Reverse Chronological — Newest First):** View all installers, changelogs, and bug fixes on the [**GitHub Releases page**](https://github.com/sshihabb007/MHS-DOWNLOAD-MANAGER/releases) or in [**CHANGELOG.md**](https://github.com/sshihabb007/MHS-DOWNLOAD-MANAGER/blob/main/CHANGELOG.md).",
            "",
            "### Release Downloads",
            "- **``$SetupExeName``** *(Recommended)* — Official Windows x64 Setup Installer. Installs ``mdm.exe``, dedicated ``Uninstall.exe``, shortcuts, Native Messaging host, and keeps the ready-to-load **``extension\``** folder directly inside your installation directory (``<InstallDir>\extension``).",
            "- **``$PortableExeName``** — Standalone Portable Windows x64 Executable (``mdm.exe``). Run directly from any folder with zero installation.",
            "- **``$ExtArchiveName``** — Standalone Unpacked Browser Extension ZIP (for Portable users; Setup Installer users already get ``<InstallDir>\extension`` automatically).",
            "- **``SHA256SUMS.txt``** — Official SHA-256 verification checksums (plus GitHub SLSA Build Provenance Attestations).",
            "",
            "### How to Install & Load the Browser Extension from Your Installation Directory",
            "1. Download and run **``$SetupExeName``** (default install folder: ``C:\Program Files (x86)\MHS Download Manager``).",
            "2. On the final screen of Setup, the path ``<InstallDir>\extension`` is copied to your clipboard automatically (you can also click **Copy Path** / **Open Folder**, or open it anytime inside the app via **`☰` Menu -> Help -> Open Browser Extension Folder**).",
            "3. Open ``chrome://extensions`` (Chrome), ``brave://extensions`` (Brave), ``edge://extensions`` (Edge), or ``opera://extensions`` (Opera).",
            "4. Enable **Developer mode** (top-right toggle).",
            "5. Click **Load unpacked** and select the **``extension``** folder inside your installation directory:",
            "   ``C:\Program Files (x86)\MHS Download Manager\extension`` *(or ``<YourInstallDir>\extension``)*.",
            ""
          )

          $ChangelogPath = Join-Path $PWD "CHANGELOG.md"
          if (Test-Path -LiteralPath $ChangelogPath) {
            $ChangelogRaw = Get-Content -LiteralPath $ChangelogPath -Raw
            $EscTag = [regex]::Escape($TagVer)
            $CurMatch = [regex]::Match($ChangelogRaw, "(?ms)^## \[$EscTag\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
            if ($CurMatch.Success) {
              $NotesLines += "### What's New & Bug Fixes in $TagVer"
              $NotesLines += $CurMatch.Groups[1].Value.Trim()
              $NotesLines += ""
            }
          }

          $NotesLines += @(
            "### SHA-256 Checksums ($TagVer)",
            "| Release File | Purpose | SHA-256 |",
            "| :--- | :--- | :--- |",
            "| ``$SetupExeName`` | Windows x64 Setup Installer (includes ``mdm.exe`` + ``Uninstall.exe`` + ``<InstallDir>\extension``) | ``$SetupSha`` |",
            "| ``$PortableExeName`` | Standalone Portable x64 Executable (zero-install ``mdm.exe``) | ``$PortableSha`` |",
            "| ``$ExtArchiveName`` | Unpacked Browser Extension Archive (Chrome / Brave / Edge / Opera) | ``$ExtZipSha`` |",
            "",
            "---",
            "",
            "### Complete Release History (Reverse Chronological — Newest First)"
          )

          if (Test-Path -LiteralPath $ChangelogPath) {
            $AllSections = [regex]::Matches($ChangelogRaw, "(?ms)^## \[([^\]]+)\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
            foreach ($Sec in $AllSections) {
              $SecVer = $Sec.Groups[1].Value
              $SecHeaderLine = ($Sec.Value.Split("`n")[0].Trim() -replace '^##\s*', '')
              $SecBody = $Sec.Groups[2].Value.Trim()
              if ($SecVer -ne $TagVer) {
                $NotesLines += ""
                $NotesLines += "<details>"
                $NotesLines += "<summary><strong>$SecHeaderLine</strong> — View full features & bug fixes (<a href=`"https://github.com/sshihabb007/MHS-DOWNLOAD-MANAGER/releases/tag/$SecVer`">$SecVer downloads</a>)</summary>"
                $NotesLines += ""
                $NotesLines += $SecBody
                $NotesLines += ""
                $NotesLines += "</details>"
              }
            }
          }
          Set-Content -Path (Join-Path $PWD "release-dist\RELEASE_NOTES.md") -Value ($NotesLines -join "`r`n") -Encoding UTF8
          "tag_ver=$TagVer" >> $env:GITHUB_OUTPUT
          "ver_clean=$VerClean" >> $env:GITHUB_OUTPUT

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MHS-Download-Manager-${{ github.ref_name }}-Windows-x64
          path: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/MHS-Download-Manager-Portable-*-x64.exe
            release-dist/MHS-Browser-Extension-*.zip
            release-dist/SHA256SUMS.txt
            release-dist/RELEASE_NOTES.md
          if-no-files-found: error

  publish-github-release:
    name: Attest Provenance & Publish GitHub Release
    needs: build-windows-x64-installer
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download Verified Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MHS-Download-Manager-${{ github.ref_name }}-Windows-x64
          path: release-dist

      - name: Generate GitHub SLSA Build Provenance Attestations
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/MHS-Download-Manager-Portable-*-x64.exe
            release-dist/MHS-Browser-Extension-*.zip
            release-dist/SHA256SUMS.txt

      - name: Optional Recreate Release Only When Explicitly Requested
        if: github.event_name == 'workflow_dispatch' && inputs.force_recreate_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VER: ${{ needs.build-windows-x64-installer.outputs.tag_ver }}
        run: |
          if gh release view "$TAG_VER" >/dev/null 2>&1; then
            gh release delete "$TAG_VER" --yes
          fi

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build-windows-x64-installer.outputs.tag_ver }}
          name: "MHS Download Manager ${{ needs.build-windows-x64-installer.outputs.tag_ver }} (Mehedi Hasan Shihab)"
          body_path: release-dist/RELEASE_NOTES.md
          make_latest: "true"
          files: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/MHS-Download-Manager-Portable-*-x64.exe
            release-dist/MHS-Browser-Extension-*.zip
            release-dist/SHA256SUMS.txt
